[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hashcrypt"
version = "2.1.0"
description = "Hash identification & multi-threaded password cracking toolkit with a CLI, web dashboard and SQLite audit log"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "HashCrypt contributors" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]
keywords = ["hash", "cracker", "md5", "ntlm", "sha256", "dictionary",
            "brute-force", "password", "audit", "offensive-security"]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/hashcrypt"
Documentation = "https://github.com/YOUR-GITHUB-USERNAME/hashcrypt#readme"
Issues = "https://github.com/YOUR-GITHUB-USERNAME/hashcrypt/issues"

[project.optional-dependencies]
web = ["flask>=2.3"]

[project.scripts]
hashcrypt = "hashcrypt.cli:main"

[tool.setuptools]
packages = ["hashcrypt"]

[tool.setuptools.package-data]
hashcrypt = ["templates/*.html"]
